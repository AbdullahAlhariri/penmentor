# penmentor key bindings for ~/.config/i3/config (adjust the path to your checkout, or use `penmentor` once installed).
bindsym $mod+Shift+a exec --no-startup-id ~/src/penmentor/bin/penmentor
# straight to one question, no menu (handy for tablet buttons, see wacom.sh)
bindsym $mod+Ctrl+Shift+m exec --no-startup-id ~/src/penmentor/bin/penmentor --ask check
bindsym $mod+Ctrl+Shift+s exec --no-startup-id ~/src/penmentor/bin/penmentor --ask final
